<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Controle de Gastos Pessoais</title>
  <style>
    :root {
      --bg: #f4f6f9;
      --card: #ffffff;
      --text: #1e293b;
      --muted: #64748b;
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --primary-disabled: #93c5fd;
      --border: #cbd5e1;
      --success-bg: #dcfce7;
      --success-text: #166534;
      --error-bg: #fee2e2;
      --error-text: #991b1b;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .container {
      width: 100%;
      max-width: 440px;
      background: var(--card);
      border-radius: 14px;
      padding: 28px 24px;
      box-shadow: 0 10px 25px rgba(15, 23, 42, 0.08);
    }

    h1 {
      font-size: 1.5rem;
      margin-bottom: 6px;
      text-align: center;
    }

    .subtitle {
      font-size: 0.9rem;
      color: var(--muted);
      text-align: center;
      margin-bottom: 24px;
    }

    .form-group {
      margin-bottom: 16px;
    }

    label {
      display: block;
      font-size: 0.9rem;
      font-weight: 600;
      margin-bottom: 6px;
    }

    input,
    select {
      width: 100%;
      padding: 12px 14px;
      font-size: 1rem;
      color: var(--text);
      background-color: #fff;
      border: 1px solid var(--border);
      border-radius: 8px;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    input:focus,
    select:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
    }

    button {
      width: 100%;
      padding: 13px 16px;
      font-size: 1rem;
      font-weight: 600;
      color: #ffffff;
      background-color: var(--primary);
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background-color 0.2s, opacity 0.2s;
      margin-top: 6px;
    }

    button:hover:not(:disabled) {
      background-color: var(--primary-hover);
    }

    button:disabled {
      background-color: var(--primary-disabled);
      cursor: not-allowed;
    }

    .feedback {
      margin-top: 16px;
      padding: 12px 14px;
      border-radius: 8px;
      font-size: 0.92rem;
      font-weight: 500;
      display: none;
    }

    .feedback.sucesso {
      display: block;
      background-color: var(--success-bg);
      color: var(--success-text);
    }

    .feedback.erro {
      display: block;
      background-color: var(--error-bg);
      color: var(--error-text);
    }
  </style>
</head>
<body>
  <main class="container">
    <h1>Controle de Gastos</h1>
    <p class="subtitle">Registre seus gastos direto no Google Planilhas</p>

    <form id="form-gasto">
      <div class="form-group">
        <label for="descricao">Descrição</label>
        <input
          type="text"
          id="descricao"
          name="descricao"
          placeholder="Ex.: Almoço, Uber, Cinema..."
          required
        />
      </div>

      <div class="form-group">
        <label for="categoria">Categoria</label>
        <select id="categoria" name="categoria" required>
          <option value="" disabled selected>Selecione uma categoria</option>
          <option value="Alimentação">Alimentação</option>
          <option value="Transporte">Transporte</option>
          <option value="Lazer">Lazer</option>
          <option value="Estudos">Estudos</option>
          <option value="Outros">Outros</option>
        </select>
      </div>

      <div class="form-group">
        <label for="valor">Valor (R$)</label>
        <input
          type="number"
          id="valor"
          name="valor"
          step="0.01"
          min="0.01"
          placeholder="0.00"
          required
        />
      </div>

      <button type="submit" id="btn-salvar">Salvar Gasto</button>
    </form>

    <div id="mensagem" class="feedback" role="alert" aria-live="polite"></div>
  </main>

  <script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbx6UpNY6y5mJs4nzbatpcA8655xbdfhdjhv1dtAOwLyzAD1Es6-wcqc7etgFQEWErHDiA/exec";

    const form = document.getElementById("form-gasto");
    const btnSalvar = document.getElementById("btn-salvar");
    const mensagemEl = document.getElementById("mensagem");

    function mostrarMensagem(texto, tipo) {
      mensagemEl.textContent = texto;
      mensagemEl.className = `feedback ${tipo}`;
    }

    form.addEventListener("submit", async function (evento) {
      evento.preventDefault();

      if (!SCRIPT_URL || SCRIPT_URL === "https://script.google.com/macros/s/AKfycbx6UpNY6y5mJs4nzbatpcA8655xbdfhdjhv1dtAOwLyzAD1Es6-wcqc7etgFQEWErHDiA/exec") {
        mostrarMensagem("Configure a variável SCRIPT_URL antes de enviar.", "erro");
        return;
      }

      const descricao = document.getElementById("descricao").value.trim();
      const categoria = document.getElementById("categoria").value;
      const valorNumero = parseFloat(document.getElementById("valor").value);

      if (!descricao || !categoria || Number.isNaN(valorNumero)) {
        mostrarMensagem("Preencha todos os campos corretamente.", "erro");
        return;
      }

      btnSalvar.disabled = true;
      btnSalvar.textContent = "Salvando...";
      mensagemEl.className = "feedback";
      mensagemEl.textContent = "";

      const payload = {
        descricao: descricao,
        categoria: categoria,
        valor: valorNumero
      };

      try {
        const resposta = await fetch(SCRIPT_URL, {
          method: "POST",
          headers: {
            "Content-Type": "text/plain;charset=utf-8"
          },
          body: JSON.stringify(payload)
        });

        if (!resposta.ok) {
          throw new Error(`Falha na requisição (HTTP ${resposta.status})`);
        }

        const resultado = await resposta.json();

        if (resultado.status === "sucesso") {
          mostrarMensagem("Gasto salvo na planilha com sucesso!", "sucesso");
          form.reset();
        } else {
          throw new Error(resultado.mensagem || "Erro ao salvar na planilha.");
        }
      } catch (erro) {
        mostrarMensagem(`Erro ao enviar: ${erro.message}`, "erro");
      } finally {
        btnSalvar.disabled = false;
        btnSalvar.textContent = "Salvar Gasto";
      }
    });
  </script>
</body>
</html>
